[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diagram-theorem-assistant"
version = "0.1.0"
description = "Prototype for translating geometry diagrams and problem text into Lean theorem candidates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
diagram-theorem-demo = "diagram_theorem_assistant.demo:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
